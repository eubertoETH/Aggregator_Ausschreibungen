name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - 'Code/**'
              - 'Docker/Dockerfile'
              - 'requirements.txt'

  validate:
    name: Test and validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run project tests
        run: make test
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f Docker/compose.yaml config --quiet

  publish:
    name: Build and publish image
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.image == 'true'))
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
      - name: Notify Discord of image build result
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_BUILD_WEBHOOK is not configured; skipping notification."
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            ICON="✅"
            MESSAGE="Container image published: ghcr.io/eubertoeth/aggregator_ausschreibungen:${GITHUB_SHA} (and :latest)"
          else
            ICON="❌"
            MESSAGE="Container image build or publish failed."
          fi

          payload="$(printf '%s\n%s\n%s\n' \
            "${ICON} **aggregator image ${RESULT}**" "$MESSAGE" "$RUN_URL" \
            | node -e 'let input=""; process.stdin.on("data", c => input += c).on("end", () => process.stdout.write(JSON.stringify({content: input})))')"
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK"
