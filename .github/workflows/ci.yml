name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run project tests
        run: make test
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose -f Docker/compose.yaml config --quiet

  publish:
    name: Build and publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  notify:
    name: Notify Discord
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Send build result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$VALIDATE_RESULT" == "success" && "$PUBLISH_RESULT" == "success" ]]; then
            RESULT="✅ Aggregator build erfolgreich"
          else
            RESULT="❌ Aggregator build fehlgeschlagen"
          fi
          payload=$(jq -nc --arg content "$RESULT\nCommit: \`$COMMIT_SHA\`\nRun: $RUN_URL" '{content: $content}')
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
