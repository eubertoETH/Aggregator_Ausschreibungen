name: aggregator-ausschreibungen

services:
  app:
    image: ${AGGREGATOR_IMAGE:?Set AGGREGATOR_IMAGE in the host .env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "${SERVICE_BIND:-127.0.0.1}:${SERVICE_PORT:-8080}:8080"
    volumes:
      - aggregator_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - postgres_password
  migrate:
    image: ${AGGREGATOR_IMAGE:?Set AGGREGATOR_IMAGE in the host .env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    secrets:
      - postgres_password
  scheduler:
    image: ${AGGREGATOR_IMAGE:?Set AGGREGATOR_IMAGE in the host .env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - aggregator_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - postgres_password
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    secrets:
      - postgres_password
volumes:
  aggregator_data:
  postgres_data:
secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_HOST_FILE:?Set POSTGRES_PASSWORD_HOST_FILE in the host .env}
