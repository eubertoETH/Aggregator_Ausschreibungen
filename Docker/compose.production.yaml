services:
  app:
    image: ghcr.io/eubertoeth/aggregator_ausschreibungen:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    volumes:
      - aggregator_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    image: ghcr.io/eubertoeth/aggregator_ausschreibungen:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - aggregator_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  aggregator_data:
  postgres_data:
