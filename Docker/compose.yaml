services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: ghcr.io/eubertoeth/aggregator_ausschreibungen:local
    env_file:
      - ../.env
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    volumes:
      - aggregator_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggregator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  scheduler:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    env_file:
      - ../.env
    command: ["python", "-m", "app.scheduler"]
    volumes:
      - aggregator_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  aggregator_data:
  postgres_data:
